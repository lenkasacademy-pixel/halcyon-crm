<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halcyon CRM</title>
<style>
/* ------------------------------------------------------------------
   Two screens. Dashboard answers "how are we doing"; Leads is the table
   a caller lives in. The cockpit opens beside the table rather than over
   it, because the job is working down a queue.
   ------------------------------------------------------------------ */
:root{
  --bg:#eef1f6; --card:#fff; --line:#e2e8f0; --line2:#f1f5f9;
  --ink:#0f172a; --dim:#64748b; --faint:#94a3b8;
  --nav:#2c0a1b;
  --accent:#a32c60; --accent2:#7c2049; --soft:#fdf2f7;
  --teal:#2e9aa6; --teal-s:#e0f2f4;
  --amber:#b45309; --amber-s:#fef3c7;
  --red:#b91c1c;   --red-s:#fee2e2;
  --green:#15803d; --green-s:#dcfce7;
  --blue:#1d4ed8;  --blue-s:#dbeafe;
  --violet:#6d28d9;--violet-s:#ede9fe;
  --grey:#475569;  --grey-s:#f1f5f9;
  --r:12px; --tap:42px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);
  font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.hide{display:none !important}
svg{flex:none}

/* ---------------- login ---------------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--nav)}
.card-login{background:var(--card);border-radius:16px;padding:30px;width:100%;max-width:340px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.card-login h1{margin:0 0 4px;font-size:21px}
.card-login h1 span{color:var(--accent)}
.card-login p{margin:0 0 20px;color:var(--dim);font-size:13px}
.pin{width:100%;height:52px;text-align:center;font-size:26px;letter-spacing:10px;padding-left:10px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:10px 0 0}

/* ---------------- top nav ---------------- */
.nav{position:sticky;top:0;z-index:30;background:var(--nav);color:#fff}
.nav__in{display:flex;align-items:center;gap:6px;padding:0 16px;height:56px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;
  padding-right:14px;white-space:nowrap}
.brand em{font-style:normal;color:#f0a9c8;font-weight:600}
.navtab{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;
  color:rgba(255,255,255,.76);font-weight:600;font-size:14px}
.navtab:hover{background:rgba(255,255,255,.08);color:#fff}
.navtab.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(240,169,200,.4)}
.navtab .n{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;
  padding:1px 7px;min-width:20px;text-align:center}
.navtab.on .n{background:var(--accent)}
.who{margin-left:auto;text-align:right;line-height:1.2;font-size:12.5px;padding-right:10px}
.who b{display:block;font-size:13.5px;font-weight:600}
.who span{color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.navbtn{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;
  border:1px solid rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:600}
.navbtn:hover{background:rgba(255,255,255,.1)}
.only-s{display:none}
/* the bar carries brand, two tabs, a name and two buttons; on a phone that is
   more than 390px holds, and it pushed the whole page sideways */
@media(max-width:700px){
  .nav__in{gap:5px;padding:0 10px}
  .brand{padding-right:4px}
  .brand em{display:none}
  .who{display:none}
  #tabLeads{margin-right:auto}
  .navtab{padding:0 10px;font-size:13.5px;gap:5px}
  .navbtn{padding:0 9px}
  .navbtn .lbl{display:none}
  .navbtn .only-s{display:inline}
}

/* ---------------- page shell ---------------- */
/* No transition on this padding. Toggling the dock class in the same tick as
   the view becomes visible left the transition stuck at its start value, so
   the table sat under the panel while every rule said otherwise. The panel
   itself animates; the page just snaps. */
.wrap{max-width:1560px;margin:0 auto;padding:20px 16px 70px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.head h1{margin:0;font-size:23px;letter-spacing:-.01em}
.head .count{color:var(--dim);font-size:14px}
.seg{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.seg button{padding:5px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--ink);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px}
.panel__h{display:flex;align-items:center;gap:8px;margin:0 0 13px;font-size:14.5px;font-weight:650}
.panel__h .right{margin-left:auto;font-size:13px;font-weight:500;color:var(--dim)}

/* ---------------- dashboard ---------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.kpi__t{color:var(--dim);font-size:13px;font-weight:600}
.kpi__v{font-size:29px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.05}
.kpi__s{color:var(--faint);font-size:12px;margin-top:5px}
.kpi.warn{background:#fff7f7;border-color:#f6d5d5}
.kpi.warn .kpi__v,.kpi.warn .kpi__t{color:var(--red)}
.kpi.go .kpi__v{color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--card)}
.tile b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.tile span{color:var(--dim);font-size:12.5px}
.tile.z b{color:var(--faint)}
.pipe{display:grid;gap:9px}
.pipe__row{display:grid;grid-template-columns:150px 54px 1fr;align-items:center;gap:12px}
.pipe__row b{font-size:19px;font-weight:700;text-align:right}
.pipe__lbl{color:var(--dim);font-size:13.5px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#94a3b8}
.bar i.amber{background:#f59e0b} .bar i.blue{background:#3b82f6}
.bar i.violet{background:#8b5cf6} .bar i.teal{background:#14b8a6}
.bar i.green{background:#22c55e} .bar i.red{background:#ef4444}

/* ---------------- filters ---------------- */
.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.fld{display:flex;align-items:center;gap:7px;height:38px;padding:0 11px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;color:var(--dim)}
.fld input,.fld select{border:0;background:none;outline:none;min-width:0;color:var(--ink);height:100%}
.fld input{width:240px}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:38px;padding:0 13px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip b{font-weight:750}

/* ---------------- leads table ---------------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
  font-weight:700;padding:11px 14px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f8fafc}
tbody tr.is-on{background:var(--soft)}
tbody tr.is-on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.nm{font-weight:650}
.sub{color:var(--faint);font-size:12px;margin-top:3px}
.tag{display:inline-block;background:var(--grey-s);color:var(--grey);border-radius:5px;padding:1px 7px;
  font-size:11px;font-weight:700}
.ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  border-radius:8px;border:1px solid var(--line);color:var(--dim);background:var(--card)}
.ic:hover{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.ic.wa:hover{border-color:#25a95c;color:#25a95c;background:#e9f9ef}
.contact{display:flex;gap:6px}
.stagesel{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 6px;background:var(--card);
  font-size:13px;font-weight:600;max-width:150px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;
  font-weight:650;background:var(--grey-s);color:var(--grey)}
.pill.amber{background:var(--amber-s);color:var(--amber)}
.pill.blue{background:var(--blue-s);color:var(--blue)}
.pill.violet{background:var(--violet-s);color:var(--violet)}
.pill.teal{background:var(--teal-s);color:var(--teal)}
.pill.green{background:var(--green-s);color:var(--green)}
.pill.red{background:var(--red-s);color:var(--red)}
.due{font-size:13px;font-weight:600;white-space:nowrap}
.due.now{color:var(--amber)} .due.late{color:var(--red)} .due.soon{color:var(--dim);font-weight:500}
.dash{color:var(--faint)}
.c-open{text-align:right;width:44px}
.more{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;
  color:var(--faint);font-size:16px;line-height:1}
tbody tr:hover .more{background:var(--soft);color:var(--accent)}
.empty{text-align:center;color:var(--dim);padding:54px 20px}

/* the same rows as cards, once a table stops fitting */
.cards{display:none}
.lead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-bottom:9px;cursor:pointer}
.lead.is-on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lead .top{display:flex;justify-content:space-between;gap:10px}
.lead .ph{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.lead .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
@media(max-width:900px){
  .tblwrap{display:none}
  .cards{display:block}
  .fld.search{flex:1 1 100%}
  .fld.search input{width:100%}
  .pipe__row{grid-template-columns:110px 42px 1fr;gap:9px}
}

/* ---------------- cockpit ---------------- */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.42);display:flex;
  align-items:flex-end;justify-content:center}
#sheet.hide{display:none !important}
.panel-c{background:var(--card);width:100%;max-width:620px;max-height:94dvh;
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:700px){#sheet{align-items:center}.panel-c{border-radius:16px;max-height:88dvh}}
/* Literal widths, deliberately: an earlier version insets the page with
   calc(16px + var(--dock)) on a transitioned property and Chrome dropped it,
   leaving the table under the panel. Two plain numbers cannot misbehave. */
@media(min-width:1100px){
  html.docked .wrap{padding-right:456px}
  #sheet:not(.hide){background:none;inset:0 0 0 auto;width:440px;display:block}
  #sheet:not(.hide) .panel-c{width:100%;max-width:none;height:100dvh;max-height:none;border-radius:0;
    border-left:1px solid var(--line);animation:slidein .2s ease-out;
    box-shadow:-18px 0 40px -30px rgba(15,23,42,.5)}
}
.phead{padding:15px 16px 13px;border-bottom:1px solid var(--line)}
.phead .row{display:flex;align-items:flex-start;gap:9px}
.phead h2{margin:0;font-size:18.5px;line-height:1.25}
.phead .psub{color:var(--dim);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.pnav{display:flex;gap:4px}
.pnav button{width:30px;height:30px;border-radius:8px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);display:grid;place-items:center;font-size:13px}
.pnav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pnav button:disabled{opacity:.35;cursor:default}
.pos{font-size:12px;color:var(--faint);align-self:center;padding:0 3px;white-space:nowrap}
.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--dim);
  display:grid;place-items:center;font-size:17px}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);
  border-radius:10px;background:var(--accent);color:#fff;font-weight:650;padding:0 16px;width:100%;
  text-decoration:none;font-size:14px}
.btn:hover{background:var(--accent2)}
.btn.wa{background:#25a95c}.btn.wa:hover{background:#1e8c4c}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.ptabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.ptab{padding:11px 0 9px;font-size:13.5px;font-weight:650;color:var(--dim);border-bottom:2px solid transparent}
.ptab.on{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:14px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.kv{display:grid;grid-template-columns:106px 1fr;gap:8px 12px;font-size:13.5px;margin:0 0 4px}
.kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-word}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  margin:18px 0 9px;font-weight:700}
.stages{display:flex;flex-wrap:wrap;gap:7px}
.stages button{padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--dim)}
.stages button:hover{border-color:var(--accent);color:var(--accent)}
.stages button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.act:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:6px;flex:none}
.dot.call{background:#3b82f6} .dot.note{background:var(--accent)}
.dot.stage{background:#8b5cf6} .dot.followup{background:#f59e0b} .dot.meta{background:#22c55e}
.act .when{color:var(--faint);font-size:11.5px;margin-top:2px}
.act .body{flex:1;min-width:0}

/* ---------------- modal + toast ---------------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px}
#modal.hide{display:none !important}
.mbox{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:410px;
  box-shadow:0 30px 60px -25px rgba(15,23,42,.45)}
.mbox h3{margin:0 0 12px;font-size:16.5px}
.mbox label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:650}
.mbox textarea,.mbox input,.mbox select{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;min-height:var(--tap)}
.mbox textarea{min-height:88px;resize:vertical}
.mbox textarea:focus,.mbox input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13px;color:var(--dim);font-weight:600}
.opts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mrow{display:flex;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:90;background:var(--ink);
  color:#fff;border-radius:10px;padding:11px 16px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:.22s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============================ login ============================ -->
<section id="login">
  <form class="card-login" onsubmit="doLogin(event)">
    <h1>Halcyon <span>CRM</span></h1>
    <p>Enter the PIN from the Users sheet.</p>
    <input class="pin" id="pin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off"
           placeholder="&bull;&bull;&bull;&bull;" aria-label="PIN">
    <p class="err" id="loginErr"></p>
    <button class="btn" type="submit" id="loginBtn" style="margin-top:8px">Open</button>
  </form>
</section>

<!-- ============================= app ============================= -->
<div id="app" class="hide">
  <header class="nav">
    <div class="nav__in">
      <span class="brand">Halcyon <em>CRM</em></span>
      <button class="navtab on" id="tabDash" onclick="go('dash')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard</button>
      <button class="navtab" id="tabLeads" onclick="go('leads')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        Leads <span class="n" id="nLeads">0</span></button>
      <div class="who"><b id="uName"></b><span id="uRole"></span></div>
      <button class="navbtn" onclick="refresh()" title="Refresh">&#8635;</button>
      <button class="navbtn" onclick="doLogout()" title="Log out"><span class="lbl">Log out</span><span class="only-s">&#9099;</span></button>
    </div>
  </header>

  <!-- ---------- dashboard ---------- -->
  <main class="wrap" id="viewDash">
    <div class="head">
      <h1>Dashboard</h1>
      <div class="seg" id="rangeSeg"></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <section class="panel">
      <h2 class="panel__h">Where they came from <span class="right" id="srcTotal"></span></h2>
      <div class="tiles" id="srcTiles"></div>
    </section>
    <section class="panel">
      <h2 class="panel__h">Meta events sent <span class="right" id="evTotal"></span></h2>
      <div class="tiles" id="evTiles"></div>
    </section>
    <section class="panel">
      <h2 class="panel__h">Pipeline <span class="right" id="pipeTotal"></span></h2>
      <div class="pipe" id="pipe"></div>
    </section>
  </main>

  <!-- ---------- leads ---------- -->
  <main class="wrap hide" id="viewLeads">
    <div class="head"><h1>Leads</h1><span class="count" id="leadCount"></span></div>
    <div class="filters">
      <label class="fld search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search name or phone" oninput="draw()" autocomplete="off">
      </label>
      <label class="fld"><select id="fSource" onchange="draw()"><option value="">All sources</option></select></label>
      <label class="fld"><select id="fOwner" onchange="draw()"><option value="">All owners</option></select></label>
      <label class="fld"><select id="fSort" onchange="draw()">
        <option value="due">Due first</option>
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
      </select></label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th>Name</th><th>Contact</th><th>Source</th><th>Owner</th>
          <th>Stage</th><th>Next follow-up</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty hide" id="tblEmpty"></p>
    </div>
    <div class="cards" id="cards"></div>
  </main>
</div>

<!-- =========================== cockpit =========================== -->
<div id="sheet" class="hide" onclick="if(event.target===this)closeLead()">
  <div class="panel-c" role="dialog" aria-label="Lead">
    <div class="phead">
      <div class="row">
        <div style="flex:1;min-width:0">
          <h2 id="cName">&mdash;</h2>
          <div class="psub" id="cSub"></div>
        </div>
        <div class="pnav">
          <button id="cPrev" onclick="step(-1)" aria-label="Previous lead" title="Previous (k)">&#8593;</button>
          <button id="cNext" onclick="step(1)" aria-label="Next lead" title="Next (j)">&#8595;</button>
        </div>
        <span class="pos" id="cPos"></span>
        <button class="x" onclick="closeLead()" aria-label="Close">&times;</button>
      </div>
      <div class="acts">
        <a class="btn" id="cCall" href="#">&#9742; Call</a>
        <a class="btn wa" id="cWa" href="#" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
    <div class="ptabs">
      <button class="ptab on" data-p="overview" onclick="cockpitTab('overview')">Overview</button>
      <button class="ptab" data-p="activity" onclick="cockpitTab('activity')">Activity <span id="cActN" style="opacity:.6"></span></button>
    </div>
    <div class="pbody">
      <div id="pOverview">
        <dl class="kv" id="cFacts"></dl>
        <div class="sec">Stage</div>
        <div class="stages" id="cStages"></div>
        <div class="sec">Do</div>
        <div class="grid2">
          <button class="btn ghost" onclick="openModal('call')">Log a call</button>
          <button class="btn ghost" onclick="openModal('note')">Add a note</button>
          <button class="btn ghost" onclick="openModal('followup')">Follow-up</button>
          <button class="btn ghost" onclick="openModal('owner')">Take this lead</button>
        </div>
        <div class="sec">Meta events sent</div>
        <div id="cEvents" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      </div>
      <div id="pActivity" class="hide"></div>
    </div>
  </div>
</div>

<div id="modal" class="hide" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
/* ---------------- talking to the server ---------------- */
function call(fn, args){
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args || []);
  });
}
var S = { token:'', user:null, leads:[], stages:[], outcomes:[], counts:{}, whatsapp:'',
          tab:'queue', view:[], lead:null, activity:[], modal:null, pick:null,
          page:'dash', range:30 };

function toast(msg, bad){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = ''; }, bad ? 4200 : 2200);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function tone(stage){
  for (var i = 0; i < S.stages.length; i++)
    if (S.stages[i].label.toLowerCase() === String(stage).toLowerCase()) return S.stages[i].tone;
  return 'grey';
}
/* "7 min ago" — how fresh a lead is, which is what decides who to ring */
function ago(iso){
  if (!iso) return '';
  var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60);
  if (h < 24) return h + ' h ago';
  var d = Math.round(h / 24);
  return d + (d === 1 ? ' day ago' : ' days ago');
}

/* ---------------- login ---------------- */
function doLogin(e){
  e.preventDefault();
  var btn = document.getElementById('loginBtn'), pin = document.getElementById('pin').value;
  document.getElementById('loginErr').textContent = '';
  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
  call('apiLogin', [pin]).then(function(r){
    btn.innerHTML = 'Open'; btn.disabled = false;
    if (!r.ok) { document.getElementById('loginErr').textContent = r.error; return; }
    S.token = r.token;
    try { sessionStorage.setItem('halcyon.crm', r.token); } catch (err) {}
    boot();
  }).catch(function(err){
    btn.innerHTML = 'Open'; btn.disabled = false;
    document.getElementById('loginErr').textContent = String(err.message || err);
  });
}
function doLogout(){
  /* the session expires on its own; apiLogin has no logout */
  try { sessionStorage.removeItem('halcyon.crm'); } catch (e) {}
  location.reload();
}

function boot(){
  return call('crmBootstrap', [S.token]).then(function(r){
    if (!r.ok) {
      try { sessionStorage.removeItem('halcyon.crm'); } catch (e) {}
      document.getElementById('login').classList.remove('hide');
      document.getElementById('app').classList.add('hide');
      return;
    }
    S.user = r.user; S.leads = r.leads; S.stages = r.stages; S.outcomes = r.outcomes;
    S.counts = r.counts; S.whatsapp = r.whatsapp;
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('uName').textContent = r.user.name;
    document.getElementById('uRole').textContent = r.user.role === 'admin' ? 'admin' : (r.user.sources || 'all');
    document.getElementById('nLeads').textContent = r.leads.length;
    fill('fSource', r.sources);
    fill('fOwner', r.leads.map(function(l){ return l.owner; })
      .filter(function(o, i, a){ return o && a.indexOf(o) === i; }).sort());
    paintRange(); drawDash(); drawChips(); draw();
  });
}
function fill(id, values){
  var sel = document.getElementById(id);
  if (sel.options.length > 1) return;
  values.forEach(function(v){
    var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
  });
}
function refresh(){ toast('Refreshing…'); boot().then(function(){ toast('Up to date'); }); }

/* ---------------- which screen ---------------- */
function go(p){
  S.page = p;
  document.getElementById('viewDash').classList.toggle('hide', p !== 'dash');
  document.getElementById('viewLeads').classList.toggle('hide', p !== 'leads');
  document.getElementById('tabDash').classList.toggle('on', p === 'dash');
  document.getElementById('tabLeads').classList.toggle('on', p === 'leads');
  if (p === 'dash') { closeLead(); drawDash(); }
  window.scrollTo(0, 0);
}

/* ---------------- dashboard ---------------- */
var RANGES = [7, 30, 90];
function paintRange(){
  document.getElementById('rangeSeg').innerHTML = RANGES.map(function(d){
    return '<button class="' + (S.range === d ? 'on' : '') + '" onclick="setRange(' + d + ')">' + d + 'd</button>';
  }).join('');
}
function setRange(d){ S.range = d; paintRange(); drawDash(); }
function inRange(l){
  return !!l.timeIso && Date.now() - new Date(l.timeIso).getTime() <= S.range * 864e5;
}
function drawDash(){
  var now = Date.now(), all = S.leads, win = all.filter(inRange);
  var k = { today:0, untouched:0, due:0, overdue:0, won:0 };
  all.forEach(function(l){
    var st = String(l.stage || '').toLowerCase();
    if (l.timeIso && now - new Date(l.timeIso).getTime() < 864e5) k.today++;
    if (st === 'new' || st === '') k.untouched++;
    if (l.nextIso) {
      var t = new Date(l.nextIso).getTime();
      if (t <= now) k.due++;
      if (t <= now - 864e5) k.overdue++;
    }
  });
  win.forEach(function(l){
    var st = String(l.stage || '').toLowerCase();
    if (st === 'converted' || st === 'booked') k.won++;
  });
  var rate = win.length ? Math.round(100 * k.won / win.length) : 0;

  document.getElementById('kpis').innerHTML = [
    kpi('New today', k.today, k.untouched + ' still not called'),
    kpi('To call now', k.due, 'follow-up time has passed'),
    kpi('Overdue', k.overdue, 'more than a day late', k.overdue ? 'warn' : ''),
    kpi('Booked or converted', k.won, 'in the last ' + S.range + ' days', k.won ? 'go' : ''),
    kpi('Conversion', rate + '%', k.won + ' of ' + win.length + ' · last ' + S.range + ' days')
  ].join('');

  var bySrc = {};
  win.forEach(function(l){ var s = l.source || 'unknown'; bySrc[s] = (bySrc[s] || 0) + 1; });
  var srcKeys = Object.keys(bySrc).sort(function(a, b){ return bySrc[b] - bySrc[a]; });
  document.getElementById('srcTotal').textContent = win.length + ' in the last ' + S.range + ' days';
  document.getElementById('srcTiles').innerHTML = srcKeys.length
    ? srcKeys.map(function(s){ return tile(bySrc[s], 'via ' + s); }).join('')
    : '<p class="empty" style="padding:16px">Nothing in this window.</p>';

  var byEv = {}, evTotal = 0;
  win.forEach(function(l){ (l.events || []).forEach(function(e){ byEv[e] = (byEv[e] || 0) + 1; evTotal++; }); });
  /* Stage events first, in funnel order, then anything else the ledger holds.
     The intake script fires HEnquiry on every lead and that is not a stage, so
     listing only the stage events would quietly under-report what Meta got. */
  var order = S.stages.filter(function(s){ return s.event; }).map(function(s){ return s.event; });
  var extra = Object.keys(byEv).filter(function(e){ return order.indexOf(e) < 0; }).sort();
  var show = order.filter(function(e){ return byEv[e]; }).concat(extra);
  document.getElementById('evTotal').textContent = evTotal + ' sent';
  document.getElementById('evTiles').innerHTML = show.length
    ? show.map(function(e){ return tile(byEv[e], e); }).join('')
    : '<p class="empty" style="padding:16px">No events sent for leads in this window.</p>';

  var byStage = {};
  all.forEach(function(l){ var s = l.stage || 'New'; byStage[s] = (byStage[s] || 0) + 1; });
  var max = Math.max.apply(null, [1].concat(S.stages.map(function(s){ return byStage[s.label] || 0; })));
  document.getElementById('pipeTotal').textContent = all.length + ' leads';
  document.getElementById('pipe').innerHTML = S.stages.map(function(s){
    var n = byStage[s.label] || 0;
    return '<div class="pipe__row"><span class="pipe__lbl">' + esc(s.label) + '</span>' +
      '<b' + (n ? '' : ' class="dash"') + '>' + n + '</b>' +
      '<span class="bar"><i class="' + s.tone + '" style="width:' + (100 * n / max) + '%"></i></span></div>';
  }).join('');
}
function kpi(title, value, sub, cls){
  return '<div class="kpi ' + (cls || '') + '"><div class="kpi__t">' + esc(title) + '</div>' +
    '<div class="kpi__v">' + esc(value) + '</div><div class="kpi__s">' + esc(sub) + '</div></div>';
}
function tile(n, label){
  return '<div class="tile' + (n ? '' : ' z') + '"><b>' + n + '</b><span>' + esc(label) + '</span></div>';
}

/* ---------------- the leads table ---------------- */
var TABS = [
  { k:'queue', label:'To call' },
  { k:'new',   label:'New' },
  { k:'today', label:'Today' },
  { k:'open',  label:'Working' },
  { k:'all',   label:'All' }
];
function drawChips(){
  var now = Date.now();
  var n = {
    queue: S.leads.filter(function(l){ return l.nextIso && new Date(l.nextIso).getTime() <= now; }).length,
    new:   S.leads.filter(function(l){ var s = String(l.stage||'').toLowerCase(); return s === 'new' || s === ''; }).length,
    today: S.leads.filter(function(l){ return l.timeIso && now - new Date(l.timeIso).getTime() < 864e5; }).length,
    all:   S.leads.length
  };
  document.getElementById('chips').innerHTML = TABS.map(function(t){
    return '<button class="chip' + (S.tab === t.k ? ' on' : '') + '" onclick="setTab(\'' + t.k + '\')">' +
      t.label + (n[t.k] ? ' <b>' + n[t.k] + '</b>' : '') + '</button>';
  }).join('');
}
function setTab(k){ S.tab = k; drawChips(); draw(); }

var DONE = ['converted', 'not qualified', 'junk', 'lost'];
function filtered(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var src = document.getElementById('fSource').value;
  var own = document.getElementById('fOwner').value;
  var sort = document.getElementById('fSort').value;
  var now = Date.now();
  var out = S.leads.filter(function(l){
    if (src && l.source !== src) return false;
    if (own && l.owner !== own) return false;
    if (q && (l.name + ' ' + l.phone).toLowerCase().indexOf(q) < 0) return false;
    var st = String(l.stage || '').toLowerCase();
    if (S.tab === 'queue') return l.nextIso && new Date(l.nextIso).getTime() <= now;
    if (S.tab === 'new')   return st === 'new' || st === '';
    if (S.tab === 'today') return l.timeIso && now - new Date(l.timeIso).getTime() < 864e5;
    if (S.tab === 'open')  return DONE.indexOf(st) < 0 && st !== 'new';
    return true;
  });
  out.sort(function(a, b){
    if (sort === 'new') return (b.timeIso || '').localeCompare(a.timeIso || '');
    if (sort === 'old') return (a.timeIso || '').localeCompare(b.timeIso || '');
    var ad = a.nextIso ? new Date(a.nextIso).getTime() : Infinity;
    var bd = b.nextIso ? new Date(b.nextIso).getTime() : Infinity;
    if (ad !== bd) return ad - bd;
    return (b.timeIso || '').localeCompare(a.timeIso || '');
  });
  return out;
}
function dueCell(l){
  if (!l.nextIso) return '<span class="dash">&mdash;</span>';
  var t = new Date(l.nextIso).getTime(), now = Date.now();
  var cls = t <= now - 864e5 ? 'late' : (t <= now ? 'now' : 'soon');
  return '<span class="due ' + cls + '">' + esc(l.nextAt) + '</span>';
}
function waHref(phone){
  var d = String(phone).replace(/\D/g, '');
  return 'https://wa.me/' + (d.length === 10 ? '91' + d : d);
}
var SVG_PHONE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
var SVG_CHAT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>';

function draw(){
  var rows = filtered();
  S.view = rows.map(function(l){ return l.id; });
  var openId = S.lead && S.lead.id;
  document.getElementById('leadCount').textContent =
    rows.length + (rows.length === 1 ? ' lead' : ' leads') +
    (rows.length !== S.leads.length ? ' of ' + S.leads.length : '');

  document.getElementById('rows').innerHTML = rows.map(function(l){
    return '<tr class="' + (l.id === openId ? 'is-on' : '') + '" onclick="rowClick(event,\'' + esc(l.id) + '\')">' +
      '<td><div class="nm">' + esc(l.name || 'No name') + '</div>' +
        '<div class="sub">' + esc(l.phone) + ' · arrived ' + esc(ago(l.timeIso)) + '</div></td>' +
      '<td><div class="contact">' +
        '<a class="ic" href="tel:' + esc(l.phone.replace(/[^\d+]/g, '')) + '" title="Call" data-stop>' + SVG_PHONE + '</a>' +
        '<a class="ic wa" href="' + esc(waHref(l.phone)) + '" target="_blank" rel="noopener" title="WhatsApp" data-stop>' + SVG_CHAT + '</a>' +
      '</div></td>' +
      '<td>' + (l.source ? '<span class="tag">' + esc(l.source) + '</span>' : '<span class="dash">&mdash;</span>') + '</td>' +
      '<td>' + (l.owner ? esc(l.owner) : '<span class="dash">&mdash;</span>') + '</td>' +
      '<td>' + stageSelect(l) + '</td>' +
      '<td>' + dueCell(l) + '</td>' +
      '<td class="c-open"><span class="more" title="Open the lead">&#8943;</span></td>' +
    '</tr>';
  }).join('');

  document.getElementById('cards').innerHTML = rows.map(function(l){
    return '<article class="lead' + (l.id === openId ? ' is-on' : '') + '" onclick="openLead(\'' + esc(l.id) + '\')">' +
      '<div class="top"><span class="nm">' + esc(l.name || 'No name') + '</span>' +
      '<span class="ph">' + esc(l.phone) + '</span></div>' +
      '<div class="meta"><span class="pill ' + tone(l.stage) + '">' + esc(l.stage || 'New') + '</span>' +
      (l.source ? '<span class="tag">' + esc(l.source) + '</span>' : '') +
      (l.owner ? '<span class="tag">' + esc(l.owner) + '</span>' : '') +
      dueCell(l) + '</div></article>';
  }).join('');

  var e = document.getElementById('tblEmpty');
  e.classList.toggle('hide', rows.length > 0);
  e.textContent = S.tab === 'queue' ? 'Nothing is due right now.' : 'No leads match.';
  paintNav();
}
function stageSelect(l){
  return '<select class="stagesel" data-stop onchange="quickStage(event,\'' + esc(l.id) + '\')">' +
    S.stages.map(function(s){
      return '<option' + (s.label.toLowerCase() === String(l.stage).toLowerCase() ? ' selected' : '') +
        '>' + esc(s.label) + '</option>';
    }).join('') + '</select>';
}
/* a click on the row opens the cockpit, unless it landed on a control */
function rowClick(e, id){
  if (e.target.closest('[data-stop]')) return;
  openLead(id);
}
function quickStage(e, id){
  e.stopPropagation();
  var label = e.target.value;
  toast('Saving ' + label + '…');
  call('crmSetStage', [S.token, id, label]).then(function(r){
    if (!r.ok) { toast(r.error || 'Failed', true); return; }
    bumpLocal(id, { stage: r.stage });
    var meta = r.meta || {};
    toast(meta.ok ? label + ' · Meta event sent'
        : meta.error ? label + ' saved · Meta: ' + meta.error
        : label + ' saved', !!meta.error);
    if (S.lead && S.lead.id === id) reloadLead(id);
    drawDash();
  });
}

/* ---------------- cockpit ---------------- */
function openLead(id){
  document.getElementById('sheet').classList.remove('hide');
  document.documentElement.classList.add('docked');
  document.getElementById('cName').textContent = 'Loading…';
  document.getElementById('cSub').textContent = '';
  document.getElementById('cFacts').innerHTML = '';
  call('crmLead', [S.token, id]).then(function(r){
    if (!r.ok) { toast(r.error || 'Could not open', true); closeLead(); return; }
    S.lead = r.lead; S.activity = r.activity;
    paintLead();
  }).catch(function(e){ toast(String(e.message || e), true); });
}
function reloadLead(id){
  call('crmLead', [S.token, id]).then(function(x){
    if (x.ok) { S.lead = x.lead; S.activity = x.activity; paintLead(); }
  });
}
function closeLead(){
  document.getElementById('sheet').classList.add('hide');
  document.documentElement.classList.remove('docked');
  S.lead = null;
  if (S.page === 'leads') draw();
}
function cockpitTab(p){
  ['overview', 'activity'].forEach(function(k){
    document.getElementById('p' + k[0].toUpperCase() + k.slice(1)).classList.toggle('hide', k !== p);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.ptab'), function(b){
    b.classList.toggle('on', b.dataset.p === p);
  });
}
function paintNav(){
  var pos = document.getElementById('cPos'), prev = document.getElementById('cPrev'),
      next = document.getElementById('cNext');
  var i = S.lead ? S.view.indexOf(S.lead.id) : -1;
  pos.textContent = i < 0 ? '' : (i + 1) + ' / ' + S.view.length;
  prev.disabled = i <= 0;
  next.disabled = i < 0 || i >= S.view.length - 1;
}
function step(n){
  var i = S.lead ? S.view.indexOf(S.lead.id) : -1;
  if (i < 0) return;
  var j = i + n;
  if (j < 0 || j >= S.view.length) return;
  openLead(S.view[j]);
}
function paintLead(){
  var l = S.lead;
  document.getElementById('cName').textContent = l.name || 'No name';
  document.getElementById('cSub').textContent = l.phone + (l.source ? ' · ' + l.source : '');
  document.getElementById('cCall').href = 'tel:' + l.phone.replace(/[^\d+]/g, '');
  document.getElementById('cWa').href = waHref(l.phone);

  var f = [
    ['Came in', l.time],
    ['Stage', l.stage],
    ['Owner', l.owner || '—'],
    ['Follow-up', l.nextAt ? l.nextAt + (l.nextNote ? ' — ' + l.nextNote : '') : '—'],
    ['Latest note', l.remarks || '—'],
    ['Landing page', l.pageUrl ? '<a href="' + esc(l.pageUrl) + '" target="_blank" rel="noopener">' +
        esc(l.pageUrl.replace(/^https?:\/\/[^/]+/, '')) + '</a>' : '—'],
    ['Ad click', l.attributed ? 'matched (fbc present)' : 'not matched'],
    ['Lead ID', l.id]
  ];
  document.getElementById('cFacts').innerHTML = f.map(function(p){
    return '<dt>' + p[0] + '</dt><dd>' + (p[0] === 'Landing page' ? p[1] : esc(p[1])) + '</dd>';
  }).join('');

  document.getElementById('cStages').innerHTML = S.stages.map(function(s){
    return '<button class="' + (s.label.toLowerCase() === String(l.stage).toLowerCase() ? 'on' : '') +
           '" onclick="changeStage(\'' + s.label + '\')">' + s.label + '</button>';
  }).join('');

  document.getElementById('cEvents').innerHTML = l.eventsSent.length
    ? l.eventsSent.map(function(e){ return '<span class="pill green">' + esc(e) + '</span>'; }).join('')
    : '<span class="pill">none yet</span>' +
      (l.lastResult && l.lastResult.indexOf('FAIL') === 0
        ? '<span class="pill red" title="' + esc(l.lastResult) + '">last send failed</span>' : '');

  paintActivity();
  cockpitTab('overview');
  if (S.page === 'leads') draw();
}
function paintActivity(){
  document.getElementById('cActN').textContent = S.activity.length ? '(' + S.activity.length + ')' : '';
  document.getElementById('pActivity').innerHTML = S.activity.length ? S.activity.map(function(a){
    return '<div class="act"><span class="dot ' + esc(a.type) + '"></span><div class="body">' +
      '<b>' + esc(a.type === 'meta' ? 'Meta' : a.type[0].toUpperCase() + a.type.slice(1)) + '</b> ' +
      esc(a.detail) + '<div class="when">' + esc(a.time) + ' · ' + esc(a.by) + '</div></div></div>';
  }).join('') : '<p class="empty">No calls or notes logged yet.</p>';
}

/* ---------------- actions ---------------- */
function changeStage(label){
  if (label.toLowerCase() === String(S.lead.stage).toLowerCase()) return;
  var id = S.lead.id;
  toast('Saving ' + label + '…');
  call('crmSetStage', [S.token, id, label]).then(function(r){
    if (!r.ok) { toast(r.error || 'Failed', true); return; }
    var meta = r.meta || {};
    toast(meta.ok ? label + ' · Meta event sent'
        : meta.error ? label + ' saved · Meta: ' + meta.error
        : label + ' saved', !!meta.error);
    bumpLocal(id, { stage: r.stage });
    reloadLead(id); drawDash();
  });
}
function bumpLocal(id, patch){
  for (var i = 0; i < S.leads.length; i++) if (S.leads[i].id === id) {
    for (var k in patch) S.leads[i][k] = patch[k];
  }
  if (S.page === 'leads') { drawChips(); draw(); }
}

var MODALS = {
  call: function(){
    return '<h3>Log a call</h3><label>How did it go?</label><div class="opts">' +
      S.outcomes.map(function(o, i){
        return '<button onclick="pickOne(this,\'' + o.key + '\')"' + (i === 0 ? ' class="on"' : '') + '>' +
               esc(o.label) + '</button>'; }).join('') +
      '</div><label>What was said</label><textarea id="mText" placeholder="Knee pain 3 months, wants Saturday morning"></textarea>';
  },
  note: function(){
    return '<h3>Add a note</h3><textarea id="mText" placeholder="Anything the next caller should know"></textarea>';
  },
  followup: function(){
    return '<h3>Follow-up</h3><label>When</label><div class="opts">' +
      [['2h','In 2 hours'],['tom','Tomorrow 10am'],['3d','In 3 days'],['wk','Next week'],['pick','Pick a time']]
        .map(function(p, i){ return '<button onclick="pickWhen(this,\'' + p[0] + '\')"' +
          (i === 0 ? ' class="on"' : '') + '>' + p[1] + '</button>'; }).join('') +
      '</div><div id="whenWrap" class="hide"><label>Date and time</label>' +
      '<input id="mWhen" type="datetime-local"></div>' +
      '<label>Note</label><textarea id="mText" placeholder="Call after her scan report"></textarea>' +
      (S.lead && S.lead.nextAt ? '<p style="font-size:12px;color:var(--dim);margin:12px 0 0">' +
        'Currently set for ' + esc(S.lead.nextAt) +
        ' · <a href="#" onclick="clearFollow(event)">clear it</a></p>' : '');
  },
  owner: function(){
    return '<h3>Take this lead</h3><p style="font-size:13.5px;color:var(--dim);margin:0">' +
      'It will show as yours — ' + esc(S.user.name) + '.</p>';
  }
};
function openModal(kind){
  S.modal = kind;
  S.pick = kind === 'call' ? S.outcomes[0].key : (kind === 'followup' ? '2h' : null);
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="mbox">' + MODALS[kind]() +
    '<div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn" id="mSave" onclick="saveModal()">Save</button></div></div>';
  m.classList.remove('hide');
  var t = document.getElementById('mText'); if (t && kind === 'note') t.focus();
}
function closeModal(){ document.getElementById('modal').classList.add('hide'); S.modal = null; }
function pickOne(btn, key){
  S.pick = key;
  Array.prototype.forEach.call(btn.parentNode.children, function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
}
function pickWhen(btn, key){
  pickOne(btn, key);
  document.getElementById('whenWrap').classList.toggle('hide', key !== 'pick');
  if (key === 'pick') {
    var i = document.getElementById('mWhen');
    if (!i.value) {
      var d = new Date(Date.now() + 864e5);
      i.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T10:00';
    }
  }
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function whenIso(){
  var d = new Date();
  switch (S.pick) {
    case '2h':  d = new Date(Date.now() + 2 * 3600e3); break;
    case 'tom': d = new Date(Date.now() + 864e5); d.setHours(10, 0, 0, 0); break;
    case '3d':  d = new Date(Date.now() + 3 * 864e5); d.setHours(10, 0, 0, 0); break;
    case 'wk':  d = new Date(Date.now() + 7 * 864e5); d.setHours(10, 0, 0, 0); break;
    case 'pick':
      var v = document.getElementById('mWhen').value;
      if (!v) return null;
      d = new Date(v); break;
  }
  return d.toISOString();
}
function clearFollow(e){
  e.preventDefault();
  call('crmFollowUp', [S.token, S.lead.id, '', '']).then(function(r){
    if (!r.ok) { toast(r.error || 'Failed', true); return; }
    S.lead.nextAt = ''; S.lead.nextIso = ''; S.lead.nextNote = '';
    bumpLocal(S.lead.id, { nextAt:'', nextIso:'', nextNote:'' });
    closeModal(); paintLead(); toast('Follow-up cleared');
  });
}
function saveModal(){
  var kind = S.modal, id = S.lead.id;
  var text = (document.getElementById('mText') || {}).value || '';
  var btn = document.getElementById('mSave');
  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
  var done = function(msg){ closeModal(); toast(msg); reloadLead(id); drawDash(); };
  var fail = function(r){ btn.innerHTML = 'Save'; btn.disabled = false;
    toast((r && (r.error || r.message)) || 'Could not save', true); };

  if (kind === 'note') {
    if (!text.trim()) return fail({ error:'Write something first' });
    call('crmNote', [S.token, id, text]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { remarks: text }); done('Note saved');
    }).catch(fail);
  } else if (kind === 'call') {
    call('crmLogCall', [S.token, id, S.pick, text]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { stage: r.stage }); done('Call logged');
    }).catch(fail);
  } else if (kind === 'followup') {
    var iso = whenIso();
    if (!iso) return fail({ error:'Pick a date and time' });
    call('crmFollowUp', [S.token, id, iso, text]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { nextAt: r.nextAt, nextIso: r.nextIso, nextNote: text }); done('Follow-up set');
    }).catch(fail);
  } else if (kind === 'owner') {
    call('crmAssign', [S.token, id, S.user.name]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { owner: r.owner }); done('Yours now');
    }).catch(fail);
  }
}

/* esc closes the top layer; j/k walk the queue */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    if (!document.getElementById('modal').classList.contains('hide')) closeModal();
    else if (!document.getElementById('sheet').classList.contains('hide')) closeLead();
    return;
  }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '') || e.metaKey || e.ctrlKey) return;
  if (!document.getElementById('modal').classList.contains('hide')) return;
  if (!S.lead) return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  if (e.key === 'k' || e.key === 'ArrowUp')   { e.preventDefault(); step(-1); }
});

/* stay signed in across a refresh */
(function(){
  var t = '';
  try { t = sessionStorage.getItem('halcyon.crm') || ''; } catch (e) {}
  if (!t) return;
  S.token = t;
  boot();
})();
</script>
