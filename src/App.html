<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halcyon CRM</title>
<style>
/* ------------------------------------------------------------------
   One screen per lead. The caller is usually on a phone, standing at
   the desk, so: big tap targets, the phone number always reachable,
   and no horizontal scrolling anywhere.
   ------------------------------------------------------------------ */
:root{
  --bg:#0d1b24; --panel:#132735; --panel2:#18303f; --line:#24455a;
  --ink:#eaf4f8; --dim:#8fb0c0; --accent:#2bb3a3; --accent2:#1d8f82;
  --amber:#e0a33c; --red:#e05c5c; --green:#3fb370; --violet:#8d7ae8; --blue:#4aa3e0;
  --r:14px; --tap:44px; --sideW:min(460px,40vw);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.hide{display:none !important}

/* ---------- login ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;width:100%;max-width:340px}
.card h1{margin:0 0 4px;font-size:20px;letter-spacing:.2px}
.card p{margin:0 0 20px;color:var(--dim);font-size:13px}
.pin{width:100%;height:52px;text-align:center;font-size:26px;letter-spacing:10px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 0 0 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);
  border-radius:10px;background:var(--accent);color:#04201c;font-weight:650;padding:0 18px;width:100%;
  text-decoration:none}                       /* Call and WhatsApp are links */
.btn:active{background:var(--accent2)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:550}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;width:auto}
.err{color:var(--red);font-size:13px;min-height:18px;margin:10px 0 0}

/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(13,27,36,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{font-weight:700;letter-spacing:.3px}
.brand span{color:var(--accent)}
.who{margin-left:auto;color:var(--dim);font-size:12.5px;text-align:right;line-height:1.25}
.icon{width:36px;height:36px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;flex:none}

.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:550}
.tab.on{background:var(--accent);border-color:var(--accent);color:#04201c}
.tab b{font-weight:750}

.filters{display:flex;gap:8px;padding:0 14px 12px}
.filters input,.filters select{flex:1;min-width:0;height:38px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:0 11px}
.filters select{flex:0 0 118px}

main{padding:12px 14px 90px;max-width:760px;margin:0 auto}

/* ---------- lead list ---------- */
.lead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer}
.lead:active{background:var(--panel2)}
.lead .nm{font-weight:620;font-size:15.5px}
.lead .ph{color:var(--dim);font-size:13.5px;font-variant-numeric:tabular-nums}
.lead .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim)}
.pill.grey{}
.pill.amber{color:var(--amber);border-color:#5a4520}
.pill.blue{color:var(--blue);border-color:#22496a}
.pill.violet{color:var(--violet);border-color:#3d3670}
.pill.teal{color:var(--accent);border-color:#1d5a53}
.pill.green{color:var(--green);border-color:#1f5334}
.pill.red{color:var(--red);border-color:#5e2626}
.due{font-size:11.5px;font-weight:600}
.due.now{color:var(--amber)} .due.late{color:var(--red)}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}

/* ---------- cockpit ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(4,12,17,.6);display:flex;
  align-items:flex-end;justify-content:center}
#sheet.hide{display:none !important}
.panel{background:var(--bg);width:100%;max-width:620px;max-height:94dvh;border-radius:18px 18px 0 0;
  border:1px solid var(--line);display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:700px){
  #sheet{align-items:center}
  .panel{border-radius:var(--r);max-height:88dvh}
}
/* On a desk the cockpit docks to the right and the queue stays on screen, so
   a caller works down the list without it vanishing behind an overlay. The
   page is inset by the panel's width rather than covered by it. */
/* The inset goes on the shell, not on the body element: the browser zeroes
   padding on the viewport-propagating body, so it silently does nothing there. */
#app{padding-right:var(--dock,0px);transition:padding-right .22s ease}
@media(min-width:1024px){
  html.docked{--dock:var(--sideW)}
  #sheet:not(.hide){background:none;inset:0 0 0 auto;width:var(--sideW);display:block}
  #sheet:not(.hide) .panel{width:100%;max-width:none;height:100dvh;max-height:none;
    border-radius:0;border-width:0 0 0 1px;animation:slidein .2s ease-out}
}
@keyframes slidein{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
/* which row the open lead is */
.lead.is-on{border-color:var(--accent);background:var(--panel2);
  box-shadow:inset 3px 0 0 var(--accent)}
/* step through the queue without going back to the list */
.pnav{display:flex;gap:4px}
.pnav button{width:30px;height:30px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);display:grid;place-items:center;font-size:14px}
.pnav button:disabled{opacity:.3}
.pos{font-size:11.5px;color:var(--dim);align-self:center;padding:0 4px;white-space:nowrap}
.phead{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.phead .row{display:flex;align-items:flex-start;gap:10px}
.phead h2{margin:0;font-size:19px;line-height:1.25}
.phead .sub{color:var(--dim);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;margin-top:13px}
.acts .btn{flex:1}
.wa{background:#25a95c;color:#03210f}
.ptabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.ptab{padding:11px 0 9px;font-size:13.5px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent}
.ptab.on{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:14px 16px 20px;flex:1;-webkit-overflow-scrolling:touch}

.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;font-size:13.5px;margin:0 0 16px}
.kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-word}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
  margin:18px 0 9px;font-weight:700}
.stages{display:flex;flex-wrap:wrap;gap:7px}
.stages button{padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--dim)}
.stages button.on{background:var(--accent);border-color:var(--accent);color:#04201c}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{width:auto}

.act{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.act:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);margin-top:6px;flex:none}
.dot.call{background:var(--blue)} .dot.note{background:var(--accent)}
.dot.stage{background:var(--violet)} .dot.followup{background:var(--amber)}
.dot.meta{background:var(--green)}
.act .when{color:var(--dim);font-size:11.5px;margin-top:2px}
.act .body{flex:1;min-width:0}
.act .body b{font-weight:650}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(4,12,17,.72);display:grid;place-items:center;padding:16px}
#modal.hide{display:none !important}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  width:100%;max-width:400px}
.mbox h3{margin:0 0 14px;font-size:16px}
.mbox label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:600}
.mbox textarea,.mbox input,.mbox select{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:10px 11px;min-height:var(--tap)}
.mbox textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);
  font-size:13px;color:var(--dim);font-weight:550}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#04201c;font-weight:650}
.mrow{display:flex;gap:8px;margin-top:18px}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:90;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 16px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:#5e2626;color:#ffd9d9}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============================ login ============================ -->
<section id="login">
  <form class="card" onsubmit="doLogin(event)">
    <h1>Halcyon <span style="color:var(--accent)">CRM</span></h1>
    <p>Enter the PIN from the Users sheet.</p>
    <input class="pin" id="pin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off"
           placeholder="••••" aria-label="PIN">
    <p class="err" id="loginErr"></p>
    <button class="btn" type="submit" id="loginBtn" style="margin-top:8px">Open</button>
  </form>
</section>

<!-- ============================= app ============================= -->
<div id="app" class="hide">
  <header>
    <div class="bar">
      <div class="brand">Halcyon <span>CRM</span></div>
      <div class="who"><span id="uName"></span><br><span id="uRole" style="opacity:.7"></span></div>
      <button class="icon" onclick="refresh()" title="Refresh" aria-label="Refresh">&#8635;</button>
      <button class="icon" onclick="doLogout()" title="Sign out" aria-label="Sign out">&#9099;</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="filters">
      <input id="q" type="search" placeholder="Name or phone" oninput="draw()" autocomplete="off">
      <select id="fSource" onchange="draw()"><option value="">All sources</option></select>
    </div>
  </header>
  <main id="list"></main>
</div>

<!-- =========================== cockpit =========================== -->
<div id="sheet" class="hide" onclick="if(event.target===this)closeLead()">
  <div class="panel" role="dialog" aria-label="Lead">
    <div class="phead">
      <div class="row">
        <div style="flex:1;min-width:0">
          <h2 id="cName">—</h2>
          <div class="sub" id="cSub"></div>
        </div>
        <div class="pnav">
          <button id="cPrev" onclick="step(-1)" aria-label="Previous lead" title="Previous (k)">&#8593;</button>
          <button id="cNext" onclick="step(1)" aria-label="Next lead" title="Next (j)">&#8595;</button>
        </div>
        <span class="pos" id="cPos"></span>
        <button class="icon" onclick="closeLead()" aria-label="Close">&times;</button>
      </div>
      <div class="acts">
        <a class="btn" id="cCall" href="#">&#9742; Call</a>
        <a class="btn wa" id="cWa" href="#" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
    <div class="ptabs">
      <button class="ptab on" data-p="overview" onclick="cockpitTab('overview')">Overview</button>
      <button class="ptab" data-p="activity" onclick="cockpitTab('activity')">Activity <span id="cActN" style="opacity:.6"></span></button>
    </div>
    <div class="pbody">
      <div id="pOverview">
        <dl class="kv" id="cFacts"></dl>
        <div class="sec">Stage</div>
        <div class="stages" id="cStages"></div>
        <div class="sec">Do</div>
        <div class="grid2">
          <button class="btn ghost" onclick="openModal('call')">Log a call</button>
          <button class="btn ghost" onclick="openModal('note')">Add a note</button>
          <button class="btn ghost" onclick="openModal('followup')">Follow-up</button>
          <button class="btn ghost" onclick="openModal('owner')">Take this lead</button>
        </div>
        <div class="sec">Meta events sent</div>
        <div id="cEvents" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      </div>
      <div id="pActivity" class="hide"></div>
    </div>
  </div>
</div>

<div id="modal" class="hide" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
/* ---------------- talking to the server ---------------- */
function call(fn, args){
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args || []);
  });
}
var S = { token:'', user:null, leads:[], stages:[], outcomes:[], counts:{}, whatsapp:'',
          tab:'queue', lead:null, activity:[], modal:null, pick:null,
          view:[] };        /* ids in the order the queue currently shows them */

function toast(msg, bad){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = ''; }, bad ? 4200 : 2200);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* ---------------- login ---------------- */
function doLogin(e){
  e.preventDefault();
  var btn = document.getElementById('loginBtn'), pin = document.getElementById('pin').value;
  document.getElementById('loginErr').textContent = '';
  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
  call('login', [pin]).then(function(r){
    btn.innerHTML = 'Open'; btn.disabled = false;
    if (!r.ok) { document.getElementById('loginErr').textContent = r.error; return; }
    S.token = r.token;
    try { sessionStorage.setItem('halcyon.crm', r.token); } catch (err) {}
    boot();
  }).catch(function(err){
    btn.innerHTML = 'Open'; btn.disabled = false;
    document.getElementById('loginErr').textContent = String(err.message || err);
  });
}
function doLogout(){
  call('logout', [S.token]);
  try { sessionStorage.removeItem('halcyon.crm'); } catch (e) {}
  location.reload();
}

function boot(){
  return call('bootstrap', [S.token]).then(function(r){
    if (!r.ok) { try { sessionStorage.removeItem('halcyon.crm'); } catch (e) {}
                 document.getElementById('login').classList.remove('hide');
                 document.getElementById('app').classList.add('hide'); return; }
    S.user = r.user; S.leads = r.leads; S.stages = r.stages; S.outcomes = r.outcomes;
    S.counts = r.counts; S.byStage = r.byStage; S.whatsapp = r.whatsapp;
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('uName').textContent = r.user.name;
    document.getElementById('uRole').textContent = r.user.role === 'admin' ? 'admin' : (r.user.sources || 'all');
    var sel = document.getElementById('fSource');
    if (sel.options.length <= 1) r.sources.forEach(function(s){
      var o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o);
    });
    drawTabs(); draw();
  });
}
function refresh(){ toast('Refreshing…'); boot().then(function(){ toast('Up to date'); }); }

/* ---------------- list ---------------- */
var TABS = [
  { k:'queue',  label:'To call' },
  { k:'new',    label:'New' },
  { k:'today',  label:'Today' },
  { k:'open',   label:'Working' },
  { k:'all',    label:'All' }
];
function drawTabs(){
  var n = { queue: S.counts.due, new: S.counts.untouched, today: S.counts.today, all: S.counts.total };
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    var c = n[t.k];
    return '<button class="tab' + (S.tab === t.k ? ' on' : '') + '" onclick="setTab(\'' + t.k + '\')">' +
           t.label + (c ? ' <b>' + c + '</b>' : '') + '</button>';
  }).join('');
}
function setTab(k){ S.tab = k; drawTabs(); draw(); window.scrollTo(0, 0); }

var DONE = ['converted', 'not qualified', 'junk', 'lost'];
function filtered(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var src = document.getElementById('fSource').value;
  var now = Date.now();
  var out = S.leads.filter(function(l){
    if (src && l.source !== src) return false;
    if (q && (l.name + ' ' + l.phone).toLowerCase().indexOf(q) < 0) return false;
    var st = String(l.stage || '').toLowerCase();
    if (S.tab === 'queue') return l.nextIso && new Date(l.nextIso).getTime() <= now;
    if (S.tab === 'new')   return st === 'new' || st === '';
    if (S.tab === 'today') return l.timeIso && (now - new Date(l.timeIso).getTime()) < 864e5;
    if (S.tab === 'open')  return DONE.indexOf(st) < 0 && st !== 'new';
    return true;
  });
  /* Due first, oldest due at the top; then newest leads. */
  out.sort(function(a, b){
    var ad = a.nextIso ? new Date(a.nextIso).getTime() : Infinity;
    var bd = b.nextIso ? new Date(b.nextIso).getTime() : Infinity;
    if (S.tab === 'queue' || (ad !== Infinity || bd !== Infinity)) { if (ad !== bd) return ad - bd; }
    return (b.timeIso || '').localeCompare(a.timeIso || '');
  });
  return out;
}
function tone(stage){
  for (var i = 0; i < S.stages.length; i++)
    if (S.stages[i].label.toLowerCase() === String(stage).toLowerCase()) return S.stages[i].tone;
  return 'grey';
}
function draw(){
  var rows = filtered(), now = Date.now();
  S.view = rows.map(function(l){ return l.id; });
  var openId = S.lead && S.lead.id;
  document.getElementById('list').innerHTML = rows.length ? rows.map(function(l){
    var due = '';
    if (l.nextIso){
      var t = new Date(l.nextIso).getTime();
      var cls = t <= now - 864e5 ? 'late' : (t <= now ? 'now' : '');
      due = '<span class="due ' + cls + '">&#9200; ' + esc(l.nextAt) + '</span>';
    }
    return '<article class="lead' + (l.id === openId ? ' is-on' : '') +
      '" onclick="openLead(\'' + esc(l.id) + '\')">' +
      '<div class="nm">' + esc(l.name || 'No name') + '</div>' +
      '<div class="ph">' + esc(l.phone) + '</div>' +
      '<div class="meta">' +
        '<span class="pill ' + tone(l.stage) + '">' + esc(l.stage || 'New') + '</span>' +
        (l.source ? '<span class="pill">' + esc(l.source) + '</span>' : '') +
        (l.owner ? '<span class="pill">' + esc(l.owner) + '</span>' : '') +
        due +
      '</div></article>';
  }).join('') : '<p class="empty">Nothing here.' +
      (S.tab === 'queue' ? '<br>No follow-up is due right now.' : '') + '</p>';
  paintNav();
}

/* where in the queue the open lead sits, and whether stepping is possible */
function paintNav(){
  var pos = document.getElementById('cPos'), prev = document.getElementById('cPrev'),
      next = document.getElementById('cNext');
  if (!pos) return;
  var i = S.lead ? S.view.indexOf(S.lead.id) : -1;
  pos.textContent = i < 0 ? '' : (i + 1) + ' / ' + S.view.length;
  prev.disabled = i <= 0;
  next.disabled = i < 0 || i >= S.view.length - 1;
}

/* move to the lead before or after this one, without going back to the list */
function step(n){
  var i = S.lead ? S.view.indexOf(S.lead.id) : -1;
  if (i < 0) return;
  var j = i + n;
  if (j < 0 || j >= S.view.length) return;
  openLead(S.view[j]);
}

/* ---------------- cockpit ---------------- */
function openLead(id){
  document.getElementById('sheet').classList.remove('hide');
  document.documentElement.classList.add('docked');
  document.getElementById('cName').textContent = 'Loading…';
  document.getElementById('cSub').textContent = '';
  document.getElementById('cFacts').innerHTML = '';
  call('lead', [S.token, id]).then(function(r){
    if (!r.ok) { toast(r.error || 'Could not open', true); closeLead(); return; }
    S.lead = r.lead; S.activity = r.activity;
    paintLead();
  }).catch(function(e){ toast(String(e.message || e), true); });
}
function closeLead(){
  document.getElementById('sheet').classList.add('hide');
  document.documentElement.classList.remove('docked');
  S.lead = null;
  draw();                                   /* drop the highlight off the row */
}
function cockpitTab(p){
  ['overview', 'activity'].forEach(function(k){
    document.getElementById('p' + k[0].toUpperCase() + k.slice(1)).classList.toggle('hide', k !== p);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.ptab'), function(b){
    b.classList.toggle('on', b.dataset.p === p);
  });
}
function paintLead(){
  var l = S.lead;
  document.getElementById('cName').textContent = l.name || 'No name';
  document.getElementById('cSub').textContent = l.phone + (l.source ? ' · ' + l.source : '');
  document.getElementById('cCall').href = 'tel:' + l.phone.replace(/[^\d+]/g, '');
  var wa = (l.phone.replace(/\D/g, '').length === 10 ? '91' : '') + l.phone.replace(/\D/g, '');
  document.getElementById('cWa').href = 'https://wa.me/' + wa;

  var f = [
    ['Came in', l.time],
    ['Stage', l.stage],
    ['Owner', l.owner || '—'],
    ['Follow-up', l.nextAt ? l.nextAt + (l.nextNote ? ' — ' + l.nextNote : '') : '—'],
    ['Latest note', l.remarks || '—'],
    ['Landing page', l.pageUrl ? '<a href="' + esc(l.pageUrl) + '" target="_blank" rel="noopener">' +
        esc(l.pageUrl.replace(/^https?:\/\/[^/]+/, '')) + '</a>' : '—'],
    ['Ad click', l.attributed ? 'matched (fbc present)' : 'not matched'],
    ['Lead ID', l.id]
  ];
  document.getElementById('cFacts').innerHTML = f.map(function(p){
    return '<dt>' + p[0] + '</dt><dd>' + (p[0] === 'Landing page' ? p[1] : esc(p[1])) + '</dd>';
  }).join('');

  document.getElementById('cStages').innerHTML = S.stages.map(function(s){
    return '<button class="' + (s.label.toLowerCase() === String(l.stage).toLowerCase() ? 'on' : '') +
           '" onclick="changeStage(\'' + s.label + '\')">' + s.label + '</button>';
  }).join('');

  document.getElementById('cEvents').innerHTML = l.eventsSent.length
    ? l.eventsSent.map(function(e){ return '<span class="pill green">' + esc(e) + '</span>'; }).join('')
    : '<span class="pill">none yet</span>' +
      (l.lastResult && l.lastResult.indexOf('FAIL') === 0
        ? '<span class="pill red" title="' + esc(l.lastResult) + '">last send failed</span>' : '');

  paintActivity();
  cockpitTab('overview');
  draw();                                   /* move the marker to this row */
}
function paintActivity(){
  document.getElementById('cActN').textContent = S.activity.length ? '(' + S.activity.length + ')' : '';
  document.getElementById('pActivity').innerHTML = S.activity.length ? S.activity.map(function(a){
    return '<div class="act"><span class="dot ' + esc(a.type) + '"></span><div class="body">' +
      '<b>' + esc(a.type === 'meta' ? 'Meta' : a.type[0].toUpperCase() + a.type.slice(1)) + '</b> ' +
      esc(a.detail) + '<div class="when">' + esc(a.time) + ' · ' + esc(a.by) + '</div></div></div>';
  }).join('') : '<p class="empty">No calls or notes logged yet.</p>';
}

/* ---------------- actions ---------------- */
function changeStage(label){
  if (label.toLowerCase() === String(S.lead.stage).toLowerCase()) return;
  var id = S.lead.id;
  toast('Saving ' + label + '…');
  call('setStage', [S.token, id, label]).then(function(r){
    if (!r.ok) { toast(r.error || 'Failed', true); return; }
    S.lead.stage = r.stage; S.activity = r.activity;
    var meta = r.meta || {};
    toast(meta.ok ? label + ' · Meta event sent'
        : meta.skipped ? label + ' saved'
        : label + ' saved · Meta: ' + (meta.error || 'not sent'), !!meta.error);
    bumpLocal(id, { stage: r.stage });
    call('lead', [S.token, id]).then(function(x){ if (x.ok) { S.lead = x.lead; S.activity = x.activity; paintLead(); } });
  });
}
function bumpLocal(id, patch){
  for (var i = 0; i < S.leads.length; i++) if (S.leads[i].id === id) {
    for (var k in patch) S.leads[i][k] = patch[k];
  }
  draw();
}

var MODALS = {
  call: function(){
    return '<h3>Log a call</h3><label>How did it go?</label><div class="chips" id="pickWrap">' +
      S.outcomes.map(function(o, i){
        return '<button onclick="pickOne(this,\'' + o.key + '\')"' + (i === 0 ? ' class="on"' : '') + '>' +
               esc(o.label) + '</button>'; }).join('') +
      '</div><label>What was said</label><textarea id="mText" placeholder="Knee pain 3 months, wants Saturday morning"></textarea>';
  },
  note: function(){
    return '<h3>Add a note</h3><textarea id="mText" placeholder="Anything the next caller should know"></textarea>';
  },
  followup: function(){
    return '<h3>Follow-up</h3><label>When</label><div class="chips" id="pickWrap">' +
      [['2h','In 2 hours'],['tom','Tomorrow 10am'],['3d','In 3 days'],['wk','Next week'],['pick','Pick a time']]
        .map(function(p, i){ return '<button onclick="pickWhen(this,\'' + p[0] + '\')"' +
          (i === 0 ? ' class="on"' : '') + '>' + p[1] + '</button>'; }).join('') +
      '</div><div id="whenWrap" class="hide"><label>Date and time</label>' +
      '<input id="mWhen" type="datetime-local"></div>' +
      '<label>Note</label><textarea id="mText" placeholder="Call after her scan report"></textarea>' +
      (S.lead && S.lead.nextAt ? '<p style="font-size:12px;color:var(--dim);margin:12px 0 0">' +
        'Currently set for ' + esc(S.lead.nextAt) +
        ' · <a href="#" onclick="clearFollow(event)">clear it</a></p>' : '');
  },
  owner: function(){
    return '<h3>Take this lead</h3><p style="font-size:13.5px;color:var(--dim);margin:0">' +
      'It will show as yours — ' + esc(S.user.name) + '.</p>';
  }
};
function openModal(kind){
  S.modal = kind;
  S.pick = kind === 'call' ? S.outcomes[0].key : (kind === 'followup' ? '2h' : null);
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="mbox">' + MODALS[kind]() +
    '<div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn" id="mSave" onclick="saveModal()">Save</button></div></div>';
  m.classList.remove('hide');
  var t = document.getElementById('mText'); if (t && kind === 'note') t.focus();
}
function closeModal(){ document.getElementById('modal').classList.add('hide'); S.modal = null; }
function pickOne(btn, key){
  S.pick = key;
  Array.prototype.forEach.call(btn.parentNode.children, function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
}
function pickWhen(btn, key){
  pickOne(btn, key);
  document.getElementById('whenWrap').classList.toggle('hide', key !== 'pick');
  if (key === 'pick') {
    var i = document.getElementById('mWhen');
    if (!i.value) {
      var d = new Date(Date.now() + 864e5); d.setHours(10, 0, 0, 0);
      i.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T10:00';
    }
  }
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function whenIso(){
  var d = new Date();
  switch (S.pick) {
    case '2h':  d = new Date(Date.now() + 2 * 3600e3); break;
    case 'tom': d = new Date(Date.now() + 864e5); d.setHours(10, 0, 0, 0); break;
    case '3d':  d = new Date(Date.now() + 3 * 864e5); d.setHours(10, 0, 0, 0); break;
    case 'wk':  d = new Date(Date.now() + 7 * 864e5); d.setHours(10, 0, 0, 0); break;
    case 'pick':
      var v = document.getElementById('mWhen').value;
      if (!v) return null;
      d = new Date(v); break;
  }
  return d.toISOString();
}
function clearFollow(e){
  e.preventDefault();
  call('setFollowUp', [S.token, S.lead.id, '', '']).then(function(r){
    if (!r.ok) { toast(r.error || 'Failed', true); return; }
    S.lead.nextAt = ''; S.lead.nextIso = ''; S.lead.nextNote = '';
    bumpLocal(S.lead.id, { nextAt:'', nextIso:'', nextNote:'' });
    closeModal(); paintLead(); toast('Follow-up cleared');
  });
}
function saveModal(){
  var kind = S.modal, id = S.lead.id;
  var text = (document.getElementById('mText') || {}).value || '';
  var btn = document.getElementById('mSave');
  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
  var done = function(msg){ closeModal(); toast(msg);
    call('lead', [S.token, id]).then(function(x){ if (x.ok) { S.lead = x.lead; S.activity = x.activity; paintLead(); } }); };
  var fail = function(r){ btn.innerHTML = 'Save'; btn.disabled = false;
    toast((r && (r.error || r.message)) || 'Could not save', true); };

  if (kind === 'note') {
    if (!text.trim()) return fail({ error:'Write something first' });
    call('note', [S.token, id, text]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { remarks: text }); done('Note saved');
    }).catch(fail);
  } else if (kind === 'call') {
    call('logCall', [S.token, id, S.pick, text]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { stage: r.stage }); done('Call logged');
    }).catch(fail);
  } else if (kind === 'followup') {
    var iso = whenIso();
    if (!iso) return fail({ error:'Pick a date and time' });
    call('setFollowUp', [S.token, id, iso, text]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { nextAt: r.nextAt, nextIso: r.nextIso, nextNote: text }); done('Follow-up set');
    }).catch(fail);
  } else if (kind === 'owner') {
    call('assign', [S.token, id, S.user.name]).then(function(r){
      if (!r.ok) return fail(r);
      bumpLocal(id, { owner: r.owner }); done('Yours now');
    }).catch(fail);
  }
}

/* keyboard: esc closes the top layer, j/k walk the queue */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    if (!document.getElementById('modal').classList.contains('hide')) closeModal();
    else if (!document.getElementById('sheet').classList.contains('hide')) closeLead();
    return;
  }
  /* never while typing a note, or while a modal is up */
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.metaKey || e.ctrlKey) return;
  if (!document.getElementById('modal').classList.contains('hide')) return;
  if (!S.lead) return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  if (e.key === 'k' || e.key === 'ArrowUp')   { e.preventDefault(); step(-1); }
});

/* stay signed in across a refresh */
(function(){
  var t = '';
  try { t = sessionStorage.getItem('halcyon.crm') || ''; } catch (e) {}
  if (!t) return;
  S.token = t;
  boot();
})();
</script>
